name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # cho phép workflow release gọi lại toàn bộ CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # Unit test không cần torch hay GPU; chỉ cài nhóm dev để tránh tải torch CUDA (~3 GB).
      - run: uv run --frozen --only-group dev pytest -q
