name: raikiri

# Values come from compose.raikiri.env (pass it with --env-file); nothing is defaulted here.
x-raikiri-image: &raikiri-image
  image: raikiri-train:local
  build:
    context: .
    dockerfile: projects/raikiri/Dockerfile

services:
  train:
    <<: *raikiri-image
    init: true
    environment:
      RAIKIRI_DATA_DATASET_NAME: ${RAIKIRI_DATA_DATASET_NAME:?set it in compose.raikiri.env}
      # Fixed by the mounts below.
      RAIKIRI_DATA_TOKENIZER_DIR: /workspace/artifacts/raikiri/tokenizer
      RAIKIRI_TRAIN_OUTPUT_DIR: /workspace/artifacts/raikiri/checkpoints
      # Passed through only when set in the shell; otherwise config.json applies.
      RAIKIRI_DATA_MAX_SAMPLES:
      RAIKIRI_DATA_TEXT_COLUMN:
    volumes:
      - type: bind
        source: ${RAIKIRI_HOST_DATASET_DIR:?set it in compose.raikiri.env}
        target: /datasets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RAIKIRI_HOST_ARTIFACT_DIR:?set it in compose.raikiri.env}
        target: /workspace/artifacts/raikiri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tensorboard:
    <<: *raikiri-image
    init: true
    command:
      - tensorboard
      - --logdir
      - /workspace/artifacts/raikiri/tensorboard
      - --host
      - 0.0.0.0
      - --port
      - "6006"
    ports:
      - "${RAIKIRI_HOST_TB_BIND:?set it in compose.raikiri.env}:${RAIKIRI_HOST_TB_PORT:?set it in compose.raikiri.env}:6006"
    volumes:
      - type: bind
        source: ${RAIKIRI_HOST_ARTIFACT_DIR:?set it in compose.raikiri.env}
        target: /workspace/artifacts/raikiri
        read_only: true
    restart: unless-stopped
